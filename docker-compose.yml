version: "3.8"
services:
  # PostgreSQL + TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: azat_platform
      POSTGRES_USER: azat
      POSTGRES_PASSWORD: azat_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azat -d azat_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Existing MCP Server
  agtech-mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - TRANSPORT=http
      - PORT=3000
      - NASS_API_KEY=${NASS_API_KEY:-}
      - NOAA_TOKEN=${NOAA_TOKEN:-}
      - SENTINEL_CLIENT_ID=${SENTINEL_CLIENT_ID:-}
      - SENTINEL_CLIENT_SECRET=${SENTINEL_CLIENT_SECRET:-}
      - EARTHDATA_USERNAME=${EARTHDATA_USERNAME:-}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD:-}
      - PLANTNET_API_KEY=${PLANTNET_API_KEY:-}
      - EPPO_API_KEY=${EPPO_API_KEY:-}
      - AGROMONITORING_API_KEY=${AGROMONITORING_API_KEY:-}
      - YANDEX_WEATHER_API_KEY=${YANDEX_WEATHER_API_KEY:-}

  # Web Platform (Next.js)
  platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://azat:azat_dev_password@postgres:5432/azat_platform
      - MCP_SERVER_URL=http://agtech-mcp:3000
      - NEXTAUTH_URL=http://localhost:3001
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
      agtech-mcp:
        condition: service_started

volumes:
  pgdata:
